[project]
name = "biobagel"
version = "0.2.24"
authors = [
  {name = "Jakub Lála", email = "jakublala@gmail.com"},
  {name = "Ayham Al-Saffar", email = "ayham.saffar@gmail.com"},
  {name = "Stefano Angioletti-Uberti", email = "sangiole@imperial.ac.uk"},
]
description = "Protein Engineering via Exploration of an Energy Landscape"
readme = "README.md"
license = "MIT"
license_files = "LICENSE"
keywords = ["protein", "protein design", "optimization", "monte carlo", "sampling", "energy landscape"]

requires-python = ">=3.12,<3.13"
dependencies = [
    "biotite>=1.0.1",
    # Pinned to a boileroom main commit rather than a release: bagel needs APIs that exist only there --
    # the SAE model (softnanolab/boileroom#111), ESM3.inverse_fold (#119) and ESM3.inverse_generate (#131),
    # which InverseFoldingSampling needs for n_mutations > 1. The pin also carries #132, which stops a
    # non-finite temperature reaching the sampler. Repin to a published version (boileroom>=0.4.5) once
    # boileroom cuts a release that includes them.
    #
    # The version on main is 0.4.5, but that is the *target* of the next release and has never been tagged
    # or published -- main builds publish prereleases such as 0.4.5-alpha.N. boileroom's runtime image
    # lookup defaults to the installed version, so on this pin it asks for an image tag that does not
    # exist and the pull fails. Importing bagel therefore defaults BOILEROOM_IMAGE_TAG to a published
    # prerelease -- see DEFAULT_BOILEROOM_IMAGE_TAG in bagel/__init__.py, which should be bumped with this
    # pin and deleted when boileroom cuts a release.
    "boileroom @ git+https://github.com/softnanolab/boileroom.git@6eb5b633bf59fc2d9f3524c121bc1f4456be5c3c",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.6",
    "matplotlib>=3.10.0",
    "fire>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.14.1",
    "pytest>=8.3.4",
    "pytest-xdist>=3.6.1",
    "pytest-cov>=6.0.0",
    "pytest-repeat>=0.9.4",
    "ruff>=0.8.6",
    "pre-commit>=3.6.0",
]
wandb = [
    "wandb>=0.23.0",
]

[project.urls]
Repository = "https://github.com/softnanolab/bagel.git"
Issues = "https://github.com/softnanolab/bagel/issues"

[tool.mypy]
strict = true
show_traceback = true
files = ["src/bagel"]
explicit_package_bases = true #allows giving directories different mypy settings

[[tool.mypy.overrides]]
module = ["biotite.*", "boileroom.*", "pytest.*", "pandas.*", "bagel.*", "wandb"] # libraries that don't have type stubs
ignore_missing_imports = true

[[tool.mypy.overrides]]
# These two run inside the mosaic environment (JAX, mosaic, modal), which is not installed alongside bagel.
module = ["bagel.mosaic_screening.worker", "bagel.mosaic_screening.modal_service", "src.bagel.mosaic_screening.worker", "src.bagel.mosaic_screening.modal_service"]
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"] #tells editor's mypy linter to ignore these modules
ignore_errors = true

[tool.ruff]
line-length = 120
include = ["pyproject.toml", "src/bagel/**/*.py", "tests/**/*.py"]
fix = true

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["F403"] #allows wildcard import of pytest fixtures in test files

[tool.ruff.lint]
select = [
  "W", # automatically removes trailing whitespace, removes extra empty lines at end of files...
]

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bagel"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs/demo.gif"]

[tool.hatch.metadata]
allow-direct-references = true
