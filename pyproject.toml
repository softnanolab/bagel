[project]
name = "biobagel"
version = "0.2.6"
authors = [
  {name = "Jakub Lála", email = "jakublala@gmail.com"},
  {name = "Ayham Al-Saffar", email = "ayham.saffar@gmail.com"},
  {name = "Stefano Angioletti-Uberti", email = "sangiole@imperial.ac.uk"},
]
description = "Protein Engineering via Exploration of an Energy Landscape"
readme = "README.md"
license = "MIT"
license_files = "LICENSE"
keywords = ["protein", "protein design", "optimization", "monte carlo", "sampling", "energy landscape"]

requires-python = ">=3.12,<3.13"
dependencies = [
    "biotite>=1.0.1",
    # SAE features depend on the boileroom SAE model, merged to boileroom main in
    # softnanolab/boileroom#111. Pinned to that merge commit for reproducibility
    # (the features/sae branch was deleted on merge). Repin to a published version
    # (e.g. boileroom==0.5.0) once boileroom cuts a release that includes it.
    "boileroom @ git+https://github.com/softnanolab/boileroom.git@2d714679c03007ce5617c8ec6e3bc53d614b7276",
    "numpy>=2.2.0",
    "pandas>=2.2.3",
    "pydantic>=2.10.6",
    "matplotlib>=3.10.0",
    "fire>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.14.1",
    "pytest>=8.3.4",
    "pytest-xdist>=3.6.1",
    "pytest-cov>=6.0.0",
    "pytest-repeat>=0.9.4",
    "ruff>=0.8.6",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.1",
    "pre-commit>=3.6.0",
]
wandb = [
    "wandb>=0.23.0",
]

[project.urls]
Repository = "https://github.com/softnanolab/bagel.git"
Issues = "https://github.com/softnanolab/bagel/issues"

[tool.mypy]
strict = true
show_traceback = true
files = ["src/bagel"]
explicit_package_bases = true #allows giving directories different mypy settings

[[tool.mypy.overrides]]
module = ["biotite.*", "boileroom.*", "pytest.*", "pandas.*", "bagel.*", "wandb"] # libraries that don't have type stubs
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"] #tells editor's mypy linter to ignore these modules
ignore_errors = true

[tool.ruff]
line-length = 120
include = ["pyproject.toml", "src/bagel/**/*.py", "tests/**/*.py"]
fix = true

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["F403"] #allows wildcard import of pytest fixtures in test files

[tool.ruff.lint]
select = [
  "W", # automatically removes trailing whitespace, removes extra empty lines at end of files...
]

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bagel"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs/demo.gif"]

[tool.hatch.metadata]
allow-direct-references = true
